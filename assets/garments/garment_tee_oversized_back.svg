<svg xmlns="http://www.w3.org/2000/svg"
     width="640mm" height="780mm" viewBox="0 0 640 780">
  <!--
    Shirtfaced — garment_tee_oversized_back.svg
    Adult Medium oversized base
    Flat measurements used:
      - Canvas: 640 × 780 mm
      - Chest (flat width between side seams): 560 mm, centred
        Left side seam x=40, right side seam x=600
      - Shoulder width: ~480 mm
      - Shoulder slope: ~18°
      - Armpit y≈295
      - Body length (HPS to hem): ~760 mm
  -->

  <path id="garment-outline"
        fill="#f4f4f4"
        stroke="#222"
        stroke-width="1.5"
        d="M 220,40
           C 250,26 290,20 320,20
           C 350,20 390,26 420,40
           L 470,58
           C 530,90 580,145 610,195
           L 620,250
           L 565,275
           L 600,295
           L 600,770
           L 40,770
           L 40,295
           L 75,275
           L 20,250
           L 30,195
           C 60,145 110,90 170,58
           Z"/>

  <path id="garment-collar"
        fill="#e8e8e8"
        stroke="#222"
        stroke-width="1.1"
        d="M 220,40
           C 250,26 290,20 320,20
           C 350,20 390,26 420,40
           L 415,60
           C 385,48 355,42 320,42
           C 285,42 255,48 225,60
           Z"/>

  <path id="garment-seams"
        fill="none"
        stroke="#999"
        stroke-width="0.8"
        stroke-dasharray="4 3"
        d="M 170,58 L 140,85
           M 470,58 L 500,85
           M 40,295 L 40,770
           M 600,295 L 600,770
           M 75,275 L 40,295
           M 565,275 L 600,295"/>

  <!-- ===================== PRINT ZONES ===================== -->

  <path id="zone-full_back"
        fill="#4a90e2"
        fill-opacity="0.18"
        stroke="#2c6cb0"
        stroke-width="1"
        d="M 152.5,120
           L 487.5,120
           L 487.5,530
           L 152.5,530
           Z"/>

  <path id="zone-upper_back_yoke"
        fill="#e67e22"
        fill-opacity="0.20"
        stroke="#d35400"
        stroke-width="1"
        d="M 165,100
           L 475,100
           L 475,290
           L 165,290
           Z"/>

  <path id="zone-outer_back_neck"
        fill="#f39c12"
        fill-opacity="0.28"
        stroke="#d68910"
        stroke-width="0.9"
        d="M 260,28
           L 380,28
           L 375,68
           L 265,68
           Z"/>

  <path id="zone-short_sleeve_left"
        fill="#9b59b6"
        fill-opacity="0.20"
        stroke="#7d3c98"
        stroke-width="1"
        d="M 30,165
           L 90,120
           L 102,138
           L 48,190
           Z"/>

  <path id="zone-short_sleeve_right"
        fill="#9b59b6"
        fill-opacity="0.20"
        stroke="#7d3c98"
        stroke-width="1"
        d="M 610,165
           L 550,120
           L 538,138
           L 592,190
           Z"/>

</svg>
