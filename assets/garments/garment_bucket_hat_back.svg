<svg xmlns="http://www.w3.org/2000/svg"
     width="280mm" height="220mm" viewBox="0 0 280 220">
  <!--
    Shirtfaced — garment_bucket_hat_back.svg
    Bucket hat — BACK
    Flat measurements used:
      - Canvas: 280 × 220 mm
      - Crown width: ~185 mm
      - Crown height: ~85 mm
      - Brim projection visible from back
      - zone-cap_back ≤70×40 mm
      - zone-cap_side_left/right ≤65×40 mm
  -->

  <!-- Crown (back) -->
  <path id="garment-outline"
        fill="#f4f4f4"
        stroke="#222"
        stroke-width="1.4"
        d="M 47,95
           C 47,45 90,20 140,20
           C 190,20 233,45 233,95
           L 245,110
           L 35,110
           Z"/>

  <!-- Brim (back view — full circle suggestion flattened) -->
  <path id="garment-brim"
        fill="#e0e0e0"
        stroke="#222"
        stroke-width="1.2"
        d="M 35,110
           C 25,130 30,160 50,175
           C 80,195 110,205 140,205
           C 170,205 200,195 230,175
           C 250,160 255,130 245,110
           L 230,115
           C 220,140 185,160 140,160
           C 95,160 60,140 50,115
           Z"/>

  <!-- Seams -->
  <path id="garment-seams"
        fill="none"
        stroke="#999"
        stroke-width="0.7"
        stroke-dasharray="3 2"
        d="M 140,20 L 140,110
           M 100,30 L 95,110
           M 180,30 L 185,110"/>

  <!-- ===================== PRINT ZONES ===================== -->

  <path id="zone-cap_back"
        fill="#e67e22"
        fill-opacity="0.22"
        stroke="#d35400"
        stroke-width="1"
        d="M 85,35
           L 195,35
           L 198,85
           L 82,85
           Z"/>

  <path id="zone-cap_side_left"
        fill="#9b59b6"
        fill-opacity="0.18"
        stroke="#7d3c98"
        stroke-width="1"
        d="M 50,70
           L 90,60
           L 93,105
           L 52,110
           Z"/>

  <path id="zone-cap_side_right"
        fill="#9b59b6"
        fill-opacity="0.18"
        stroke="#7d3c98"
        stroke-width="1"
        d="M 190,60
           L 230,70
           L 228,110
           L 187,105
           Z"/>

</svg>
