<svg xmlns="http://www.w3.org/2000/svg"
     width="260mm" height="220mm" viewBox="0 0 260 220">
  <!--
    Shirtfaced — garment_cap_snapback_front.svg
    Structured snapback (redrawn)
    Flat measurements used:
      - Canvas: 260 × 220 mm
      - Crown width: ~190 mm
      - Crown height: ~105 mm (dome)
      - Flat brim
      - zone-cap_front ≤110×60 mm
      - zone-cap_side_left/right ≤65×40 mm
      - zone-cap_back ≤70×40 mm (above adjustment strap)
  -->

  <path id="garment-outline"
        fill="#f4f4f4"
        stroke="#222"
        stroke-width="1.4"
        d="M 35,112
           C 35,48 85,12 130,12
           C 175,12 225,48 225,112
           L 238,128
           C 248,142 250,162 242,178
           L 222,192
           L 38,192
           L 18,178
           C 10,162 12,142 22,128
           Z"/>

  <path id="garment-brim"
        fill="#e0e0e0"
        stroke="#222"
        stroke-width="1.2"
        d="M 38,192
           L 38,218
           L 222,218
           L 222,192
           Z"/>

  <path id="garment-seams"
        fill="none"
        stroke="#999"
        stroke-width="0.7"
        stroke-dasharray="3 2"
        d="M 130,12 L 130,192
           M 90,28 L 85,178
           M 170,28 L 175,178"/>

  <!-- ===================== PRINT ZONES ===================== -->

  <path id="zone-cap_front"
        fill="#4a90e2"
        fill-opacity="0.22"
        stroke="#2c6cb0"
        stroke-width="1"
        d="M 75,38
           L 185,38
           L 188,98
           L 72,98
           Z"/>

  <path id="zone-cap_side_left"
        fill="#9b59b6"
        fill-opacity="0.18"
        stroke="#7d3c98"
        stroke-width="1"
        d="M 40,115
           L 75,105
           L 78,145
           L 42,150
           Z"/>

  <path id="zone-cap_side_right"
        fill="#9b59b6"
        fill-opacity="0.18"
        stroke="#7d3c98"
        stroke-width="1"
        d="M 185,105
           L 220,115
           L 218,150
           L 182,145
           Z"/>

  <path id="zone-cap_back"
        fill="#e67e22"
        fill-opacity="0.20"
        stroke="#d35400"
        stroke-width="1"
        d="M 95,158
           L 165,158
           L 168,192
           L 92,192
           Z"/>

</svg>
