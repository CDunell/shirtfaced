<svg xmlns="http://www.w3.org/2000/svg"
     width="260mm" height="220mm" viewBox="0 0 260 220">
  <!--
    Shirtfaced — garment_cap_dad_back.svg
    Dad / unstructured cap — BACK
    Flat measurements used:
      - Canvas: 260 × 220 mm
      - Crown width: ~190 mm
      - Crown height: ~100 mm (dome)
      - Adjustment strap / buckle area at lower back
      - zone-cap_back ≤70×40 mm (above buckle)
      - zone-cap_side_left/right ≤65×40 mm
  -->

  <!-- Crown back -->
  <path id="garment-outline"
        fill="#f4f4f4"
        stroke="#222"
        stroke-width="1.4"
        d="M 35,110
           C 35,50 85,15 130,15
           C 175,15 225,50 225,110
           L 235,125
           C 245,140 248,160 240,175
           L 220,190
           L 40,190
           L 20,175
           C 12,160 15,140 25,125
           Z"/>

  <!-- Adjustment strap / buckle suggestion -->
  <path id="garment-strap"
        fill="#e0e0e0"
        stroke="#222"
        stroke-width="1.1"
        d="M 70,175
           L 70,200
           L 190,200
           L 190,175
           Z"/>

  <!-- Seams / panel lines -->
  <path id="garment-seams"
        fill="none"
        stroke="#999"
        stroke-width="0.7"
        stroke-dasharray="3 2"
        d="M 130,15 L 130,175
           M 90,30 L 85,170
           M 170,30 L 175,170"/>

  <!-- ===================== PRINT ZONES ===================== -->

  <path id="zone-cap_back"
        fill="#e67e22"
        fill-opacity="0.22"
        stroke="#d35400"
        stroke-width="1"
        d="M 80,45
           L 180,45
           L 183,110
           L 77,110
           Z"/>

  <path id="zone-cap_side_left"
        fill="#9b59b6"
        fill-opacity="0.18"
        stroke="#7d3c98"
        stroke-width="1"
        d="M 40,115
           L 75,105
           L 78,145
           L 42,150
           Z"/>

  <path id="zone-cap_side_right"
        fill="#9b59b6"
        fill-opacity="0.18"
        stroke="#7d3c98"
        stroke-width="1"
        d="M 185,105
           L 220,115
           L 218,150
           L 182,145
           Z"/>

</svg>
