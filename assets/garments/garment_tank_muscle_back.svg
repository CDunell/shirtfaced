<svg xmlns="http://www.w3.org/2000/svg"
     width="640mm" height="760mm" viewBox="0 0 640 760">
  <!--
    Shirtfaced — garment_tank_muscle_back.svg
    Adult Medium muscle/tank base — BACK
    Flat measurements used:
      - Canvas: 640 × 760 mm
      - Chest (flat width between side seams): 510 mm, centred
        Left side seam x=65, right side seam x=575
      - Shoulder strap width: ~45 mm
      - Neck opening width: ~190 mm
      - Armhole depth: ~320 mm (deep concave cut into body)
      - Body length (HPS to hem): ~730 mm
  -->

  <!-- Garment outline (back) — muscle tank with deep armholes -->
  <path id="garment-outline"
        fill="#f4f4f4"
        stroke="#222"
        stroke-width="1.5"
        d="M 245,25
           C 275,12 305,8 320,8
           C 335,8 365,12 395,25
           L 435,20
           L 445,110
           C 460,180 500,250 530,310
           C 555,360 570,400 575,450
           L 575,740
           L 65,740
           L 65,450
           C 70,400 85,360 110,310
           C 140,250 180,180 195,110
           L 205,20
           Z"/>

  <!-- Outer back neck / binding -->
  <path id="garment-collar"
        fill="#e8e8e8"
        stroke="#222"
        stroke-width="1.1"
        d="M 245,25
           C 275,12 305,8 320,8
           C 335,8 365,12 395,25
           L 390,45
           C 360,34 340,30 320,30
           C 300,30 280,34 250,45
           Z"/>

  <!-- Seams / strap & armhole indication -->
  <path id="garment-seams"
        fill="none"
        stroke="#999"
        stroke-width="0.8"
        stroke-dasharray="4 3"
        d="M 205,20 L 195,110
           M 435,20 L 445,110
           M 65,450 L 65,740
           M 575,450 L 575,740"/>

  <!-- ===================== PRINT ZONES ===================== -->

  <path id="zone-full_back"
        fill="#4a90e2"
        fill-opacity="0.18"
        stroke="#2c6cb0"
        stroke-width="1"
        d="M 175,140
           L 465,140
           L 465,530
           L 175,530
           Z"/>

  <path id="zone-upper_back_yoke"
        fill="#e67e22"
        fill-opacity="0.20"
        stroke="#d35400"
        stroke-width="1"
        d="M 210,120
           L 430,120
           L 430,240
           L 210,240
           Z"/>

  <path id="zone-centre_back"
        fill="#e74c3c"
        fill-opacity="0.22"
        stroke="#c0392b"
        stroke-width="1"
        d="M 220,160
           L 420,160
           L 420,400
           L 220,400
           Z"/>

</svg>
