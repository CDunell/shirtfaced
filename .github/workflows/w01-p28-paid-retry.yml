name: W01-P28 guarded paid retry

on:
  push:
    branches: [main]
    paths:
      - "W01-P28_PAID_RETRY_TRIGGER.md"

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    # Share the production deployment lock. If a deploy is still running, the
    # paid call waits behind it instead of racing a Studio restart.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Run exactly one guarded W01-P28 coverage generation
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} 'bash -s' > retry-result.json <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/shirtfaced-studio
          set -a
          . .env
          set +a

          prompt='worlds/world-01/shots/W01-P28.nano-banana-coverage.txt'
          adapter='app/adapters/google_media.py'

          # These guards prove the deployed host contains both halves of the
          # handover before a billable request can happen.
          grep -q 'ordinary billiards equipment' "$prompt"
          grep -q 'celebratory pub gesture' "$prompt"
          grep -q 'part of the pool-table setting' "$prompt"
          grep -q 'except Exception as error' "$adapter"
          grep -q 'raise GoogleMediaError' "$adapter"

          ./.venv/bin/python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          host = os.environ["APP_HOST"]
          if host in {"0.0.0.0", "::", ""}:
              host = "127.0.0.1"
          base = f"http://{host}:{os.environ['APP_PORT']}"

          def get_json(path: str) -> tuple[int, object]:
              request = urllib.request.Request(base + path, method="GET")
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.status, json.loads(response.read().decode("utf-8"))

          def post_json(path: str, payload: object) -> tuple[int, object]:
              data = json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  base + path,
                  data=data,
                  method="POST",
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=420) as response:
                      raw = response.read().decode("utf-8")
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8")
                  try:
                      body: object = json.loads(raw) if raw else None
                  except json.JSONDecodeError:
                      body = raw
                  return error.code, body

          _, pipeline = get_json("/api/scenes/W01-P28/pipeline")
          if not isinstance(pipeline, dict):
              raise SystemExit("Pipeline endpoint returned a non-object response")
          if pipeline.get("media_live") is not True:
              raise SystemExit("Google media is not live; refusing to spend")
          if pipeline.get("source") != "W01-P28.nano-banana-coverage.txt":
              raise SystemExit(f"Unexpected deployed prompt source: {pipeline.get('source')!r}")

          required = {
              "damo:contact_sheet",
              "emma:contact_sheet",
              "brock:contact_sheet",
          }
          available = {
              one.get("key")
              for one in pipeline.get("references", [])
              if isinstance(one, dict)
          }
          missing = sorted(required - available)
          if missing:
              raise SystemExit(f"Required approved references missing: {missing}")

          before = int(pipeline.get("attempts", 0))
          payload = {
              "label": "W01-P28 guarded retry after 338b0d5",
              "selections": [
                  "damo:contact_sheet",
                  "emma:contact_sheet",
                  "brock:contact_sheet",
              ],
              "aspect_ratio": "16:9",
          }

          # The only billable call in this workflow.
          status, body = post_json("/api/scenes/W01-P28/generate-sheet", payload)

          _, after_pipeline = get_json("/api/scenes/W01-P28/pipeline")
          after = int(after_pipeline.get("attempts", 0)) if isinstance(after_pipeline, dict) else -1
          prompt_bytes = Path("worlds/world-01/shots/W01-P28.nano-banana-coverage.txt").read_bytes()

          print(
              json.dumps(
                  {
                      "scene": "W01-P28",
                      "trigger_commit": os.environ.get("GITHUB_SHA"),
                      "prompt_sha256": hashlib.sha256(prompt_bytes).hexdigest(),
                      "selections": payload["selections"],
                      "aspect_ratio": payload["aspect_ratio"],
                      "attempts_before": before,
                      "attempts_after": after,
                      "attempt_incremented_once": after == before + 1,
                      "http_status": status,
                      "response": body,
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
          REMOTE

          cat retry-result.json

      - name: Record retry result on main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("retry-result.json").read_text(encoding="utf-8"))
          body = json.dumps(result, indent=2, sort_keys=True)
          Path("W01-P28_PAID_RETRY_RESULT.md").write_text(
              "# W01-P28 paid coverage retry result\n\n"
              "This file is machine-recorded by `.github/workflows/w01-p28-paid-retry.yml`.\n\n"
              "```json\n" + body + "\n```\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add W01-P28_PAID_RETRY_RESULT.md
          git commit -m "chore(W01-P28): record paid retry result [skip ci]"
          git push origin main
