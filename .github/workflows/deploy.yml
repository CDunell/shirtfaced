name: Deploy

on:
  # Deploying without a code change is a real need: placing a secret for the
  # first time, or re-running after fixing something on the box.
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      # Studio changes are often committed as several small GitHub API writes.
      # Never finish deploying an older intermediate commit after a newer main
      # commit exists. rsync/build/migrations are idempotent and the next run
      # re-applies the complete current tree before restart.
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          # Social change detection needs the previous push commit.
          fetch-depth: 2

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Detect Social asset changes
        id: social
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual deploy: Social assets will be rebuilt."
            exit 0
          fi

          before="${{ github.event.before }}"
          source_changed=true
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable previous commit: treating Social sources as changed."
          elif git diff --quiet "$before" "$GITHUB_SHA" -- \
            scripts/prepare-social-brand-sources.mjs \
            scripts/build-social-assets.mjs \
            DEV/logo-lockup.svg \
            DEV/shirtfaced.svg \
            DEV/smiley.svg; then
            source_changed=false
          fi

          if [ "$source_changed" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Social sources changed: rebuilding Social assets."
            exit 0
          fi

          # Source files are unchanged, but that only means skipping the rebuild
          # is safe if the box already has the rasterised assets from a previous
          # deploy. A fresh or wiped box has never produced them, and
          # deploy-studio.sh's "Checking Social render assets" step requires
          # every file below to exist -- skipping generation there would fail
          # the deploy every time until a Social source file happens to change.
          if ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            'test -s /home/ubuntu/shirtfaced-studio/public/social-assets/v3/light-corner-mark-4x5.png &&
             test -s /home/ubuntu/shirtfaced-studio/public/social-assets/v3/dark-corner-mark-4x5.png &&
             test -s /home/ubuntu/shirtfaced-studio/public/social-assets/v3/adaptive-corner-mark-4x5.png &&
             test -s /home/ubuntu/shirtfaced-studio/public/social-assets/v3/light-feed-4x5.png &&
             test -s /home/ubuntu/shirtfaced-studio/public/social-assets/v3/dark-feed-4x5.png &&
             test -s /home/ubuntu/shirtfaced-studio/public/social-assets/v3/adaptive-feed-badge-4x5.png &&
             test -s /home/ubuntu/shirtfaced-studio/public/social-assets/v3/light-title-bug-9x16.png &&
             test -s /home/ubuntu/shirtfaced-studio/public/social-assets/v3/dark-title-bug-9x16.png &&
             test -s /home/ubuntu/shirtfaced-studio/public/social-assets/v3/light-reel-9x16.png &&
             test -s /home/ubuntu/shirtfaced-studio/public/social-assets/v3/dark-reel-9x16.png &&
             test -s /home/ubuntu/shirtfaced-studio/public/social-assets/v3/adaptive-reel-badge-9x16.png'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Social sources unchanged and assets already present on the box: skipping generation, apt and rasterisation."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Social sources unchanged but the box is missing rasterised assets: rebuilding Social assets."
          fi

      - name: Sync admin app
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude=node_modules --exclude=.next --exclude=.env \
            admin/ ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-admin/

      - name: Build and restart admin app
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            'bash /home/ubuntu/deploy-admin.sh'

      # Applies any migrations deploy-admin.sh's own build didn't already run
      # (drizzle-kit migrate skips anything already applied, so this is safe
      # to run on every deploy regardless). Explicit here rather than only
      # inside that box-side script so a new migration landing is visible in
      # this workflow, not just inferred from deploy-admin.sh's own contents.
      #
      # npx --yes rather than `npm run db:migrate`: this repo doesn't control
      # deploy-admin.sh (it lives only on the box, not version-controlled
      # anywhere this session can see), so whether its own npm install keeps
      # devDependencies like drizzle-kit is unknown. npx fetches it itself
      # if it isn't already in node_modules, so this step doesn't depend on
      # that script's install flags either way.
      - name: Run admin database migrations
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            'cd /home/ubuntu/shirtfaced-admin && npx --yes drizzle-kit migrate'

      # notify-abandoned-orders.ts (added alongside the abandoned-cart email)
      # has no in-process scheduler to call it, so cron does. Idempotent: the
      # grep/replace means re-running this step (every deploy) never adds a
      # second copy of the line.
      - name: Schedule the abandoned-cart recovery job
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} '
            (crontab -l 2>/dev/null | grep -v "notify-abandoned-orders.ts";
             echo "0 * * * * cd /home/ubuntu/shirtfaced-admin && npx tsx src/db/notify-abandoned-orders.ts >> /var/log/shirtfaced-abandoned-cart.log 2>&1"
            ) | crontab -
          '

      # Studio owns mutable runtime/canon state on the box. Never let rsync --delete
      # erase var/ (canonical cast originals, cached derivatives, renderer results, etc.)
      # or worlds/. Canonical cast binaries are provisioned directly into persistent
      # server storage and are never repaired or replaced from Git.
      - name: Sync Studio
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude=worlds --exclude=var --exclude=assets --exclude=.env --exclude=.venv \
            --exclude=web/node_modules --exclude=web/dist \
            --exclude=__pycache__ --exclude=.pytest_cache \
            studio/ ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/
          # worlds/ carries scene configuration -- coverage prompts, shot specs,
          # motion direction -- so an edit to an existing file has to land. This
          # used to be --ignore-existing, which copies only files the box does not
          # already have: every canon edit since has deployed as a no-op, and it
          # went unnoticed until a prompt fix failed to reach a generation.
          #
          # No --delete. Nothing under worlds/ on the box is untracked today, but a
          # world that later writes something of its own should not lose it to a
          # deploy. Binaries the server provisions live under var/ and assets/.
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key" \
            studio/worlds/ ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/worlds/

      - name: Generate Social SVG assets
        if: steps.social.outputs.changed == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          node scripts/prepare-social-brand-sources.mjs
          node scripts/build-social-assets.mjs
          test -s public/social-assets/v3/light-feed-4x5.svg
          test -s public/social-assets/v3/dark-feed-4x5.svg
          test -s public/social-assets/v3/adaptive-feed-badge-4x5.svg
          test -s public/social-assets/v3/light-reel-9x16.svg
          test -s public/social-assets/v3/dark-reel-9x16.svg
          test -s public/social-assets/v3/adaptive-reel-badge-9x16.svg
          if grep -R -E 'data:image/svg\+xml|<mask|<symbol|<use|<image' public/social-assets/v3; then
            echo "Social overlay build contains indirect/mobile-unsafe SVG content."
            exit 1
          fi
          for file in public/social-assets/v3/*.svg; do
            grep -q '<path' "$file" || {
              echo "Social overlay has no literal brand paths: $file"
              exit 1
            }
          done

      - name: Install Social SVG rasterizer
        if: steps.social.outputs.changed == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if command -v rsvg-convert >/dev/null 2>&1; then
            echo "rsvg-convert already installed."
            exit 0
          fi
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y librsvg2-bin

      - name: Rasterize Social assets
        if: steps.social.outputs.changed == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          for file in public/social-assets/v3/*.svg; do
            png="${file%.svg}.png"
            rsvg-convert "$file" --format=png --output="$png"
            test -s "$png" || {
              echo "Failed to rasterise Social overlay: $file"
              exit 1
            }
          done
          file public/social-assets/v3/*.png | grep -q 'PNG image data' || {
            echo "Rasterised Social overlays are not valid PNG files."
            exit 1
          }

      - name: Sync Social assets into Studio
        if: steps.social.outputs.changed == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            'mkdir -p /home/ubuntu/shirtfaced-studio/public/social-assets'
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            public/social-assets/ \
            ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/public/social-assets/

      - name: Sync concept libraries into Studio
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            docs/design/ \
            ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/docs/design/

      - name: Sync garments into Studio
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            assets/garments/ \
            ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/assets/garments/

      - name: Bootstrap Studio
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            'chmod +x /home/ubuntu/shirtfaced-studio/deploy/*.sh &&
             bash /home/ubuntu/shirtfaced-studio/deploy/bootstrap-studio.sh'

      - name: Place the OpenAI key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "No OPENAI_API_KEY secret. Studio will run its fakes and bill nothing."
            exit 0
          fi
          printf '%s\n' "$OPENAI_API_KEY" | ssh -i ~/.ssh/deploy_key \
            ubuntu@${{ secrets.ORACLE_HOST }} \
            'bash /home/ubuntu/shirtfaced-studio/deploy/set-openai-key.sh'

      - name: Place the Gemini renderer key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "No GEMINI_API_KEY secret. Google renderer remains disabled and bills nothing."
            exit 0
          fi
          printf '%s\n' "$GEMINI_API_KEY" | ssh -i ~/.ssh/deploy_key \
            ubuntu@${{ secrets.ORACLE_HOST }} \
            'bash /home/ubuntu/shirtfaced-studio/deploy/set-gemini-key.sh'

      - name: Build and restart Studio
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            'bash /home/ubuntu/shirtfaced-studio/deploy/deploy-studio.sh'

      - name: Sync storefront
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude=node_modules --exclude=.next --exclude=out \
            --exclude=admin --exclude=studio --exclude=.env --exclude=.git \
            --exclude=.github \
            ./ ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-site/

      - name: Build and publish storefront
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            'bash /home/ubuntu/deploy-site.sh'

      # Studio sits behind the same session auth admin does as of 21 August
      # 2026 (app/session_auth.py) -- the smoke scripts below need a real
      # session cookie now, not just a reachable URL. Minted here rather than
      # stored as its own secret: it's a short-lived, purpose-built token,
      # not the SESSION_SECRET itself, and expires long before this workflow
      # would ever run again.
      - name: Mint a CI session token for the smoke tests
        id: mint-token
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          token=$(python3 -c "
          import base64, hashlib, hmac, os, time
          secret = os.environ['SESSION_SECRET']
          email = 'ci@shirtfaced.wtf'
          expires = int(time.time()) + 600
          email_b64 = base64.urlsafe_b64encode(email.encode()).rstrip(b'=').decode()
          payload = f'{email_b64}.{expires}'
          sig = base64.urlsafe_b64encode(hmac.new(secret.encode(), payload.encode(), hashlib.sha256).digest()).rstrip(b'=').decode()
          print(f'{payload}.{sig}')
          ")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Smoke the vintage chain
        env:
          SMOKE_SESSION_TOKEN: ${{ steps.mint-token.outputs.token }}
        run: python studio/scripts/smoke_vintage.py --base https://studio.shirtfaced.wtf

      - name: Smoke the design chain
        env:
          SMOKE_SESSION_TOKEN: ${{ steps.mint-token.outputs.token }}
        run: python studio/scripts/smoke_design_chain.py --base https://studio.shirtfaced.wtf
