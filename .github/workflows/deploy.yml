name: Deploy

on:
  # Deploying without a code change is a real need: placing a secret for the
  # first time, or re-running after fixing something on the box.
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync admin app
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude=node_modules --exclude=.next --exclude=.env \
            admin/ ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-admin/

      - name: Build and restart admin app
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            'bash /home/ubuntu/deploy-admin.sh'

      # Studio holds the world documents and the OpenAI key, and it writes canon
      # when a shot is approved. That makes the box the source of truth for
      # worlds/, so it is synced with --ignore-existing: new files arrive, and
      # nothing written on the box is ever overwritten from here.
      - name: Sync Studio
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude=worlds --exclude=assets --exclude=.env --exclude=.venv \
            --exclude=web/node_modules --exclude=web/dist \
            --exclude=__pycache__ --exclude=.pytest_cache \
            studio/ ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/
          rsync -az --ignore-existing \
            -e "ssh -i ~/.ssh/deploy_key" \
            studio/worlds/ ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/worlds/

      # Rebuild from the canonical brand vectors on every deploy. Keep the SVGs as
      # editable source outputs, but rasterise V3 to transparent PNGs for Social
      # Studio. Android/WebView has repeatedly loaded the SVG successfully and then
      # drawn it transparent when used as a canvas image; PNG removes that entire
      # browser-specific rasterisation path.
      - name: Build Social assets
        run: |
          node scripts/prepare-social-brand-sources.mjs
          node scripts/build-social-assets.mjs
          test -s public/social-assets/v3/light-feed-4x5.svg
          test -s public/social-assets/v3/dark-feed-4x5.svg
          test -s public/social-assets/v3/adaptive-feed-badge-4x5.svg
          test -s public/social-assets/v3/light-reel-9x16.svg
          test -s public/social-assets/v3/dark-reel-9x16.svg
          test -s public/social-assets/v3/adaptive-reel-badge-9x16.svg
          if grep -R -E 'data:image/svg\+xml|<mask|<symbol|<use|<image' public/social-assets/v3; then
            echo "Social overlay build contains indirect/mobile-unsafe SVG content."
            exit 1
          fi
          for file in public/social-assets/v3/*.svg; do
            grep -q '<path' "$file" || {
              echo "Social overlay has no literal brand paths: $file"
              exit 1
            }
          done

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq librsvg2-bin
          for file in public/social-assets/v3/*.svg; do
            png="${file%.svg}.png"
            rsvg-convert "$file" --format=png --output="$png"
            test -s "$png" || {
              echo "Failed to rasterise Social overlay: $file"
              exit 1
            }
          done
          file public/social-assets/v3/*.png | grep -q 'PNG image data' || {
            echo "Rasterised Social overlays are not valid PNG files."
            exit 1
          }

      # Social assets are generated at repository level because the storefront and
      # Studio share the same brand source. Studio is deployed as a standalone tree,
      # so copy those freshly generated files into its own public directory explicitly.
      - name: Sync Social assets into Studio
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            'mkdir -p /home/ubuntu/shirtfaced-studio/public/social-assets'
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            public/social-assets/ \
            ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/public/social-assets/

      # The concept libraries seed the design backlog (ADR-015). They live at
      # repository level because the libraries are brand documents, not Studio
      # code; Studio is deployed as a standalone tree, so they are copied in
      # explicitly — after the Studio sync above, whose --delete would remove
      # them from studio/docs.
      - name: Sync concept libraries into Studio
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            docs/design/ \
            ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/docs/design/

      - name: Bootstrap Studio
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            'chmod +x /home/ubuntu/shirtfaced-studio/deploy/*.sh &&
             bash /home/ubuntu/shirtfaced-studio/deploy/bootstrap-studio.sh'

      # Placed only into an empty slot, so rotating the key is done on the box and
      # a missing secret can never blank a working one. Without a key Studio runs
      # its deterministic fakes: the page works and nothing is billed.
      - name: Place the OpenAI key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "No OPENAI_API_KEY secret. Studio will run its fakes and bill nothing."
            exit 0
          fi
          # Sent over stdin rather than on the command line, so the key never
          # appears in the box's process list.
          printf '%s\n' "$OPENAI_API_KEY" | ssh -i ~/.ssh/deploy_key \
            ubuntu@${{ secrets.ORACLE_HOST }} \
            'bash /home/ubuntu/shirtfaced-studio/deploy/set-openai-key.sh'

      - name: Build and restart Studio
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            'bash /home/ubuntu/shirtfaced-studio/deploy/deploy-studio.sh'

      - name: Sync storefront
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude=node_modules --exclude=.next --exclude=out \
            --exclude=admin --exclude=studio --exclude=.env --exclude=.git \
            --exclude=.github \
            ./ ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-site/

      - name: Build and publish storefront
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            'bash /home/ubuntu/deploy-site.sh'

      # Runs after everything is live. A green deploy has repeatedly meant
      # nothing: images 400'd behind a correct listing count, research was
      # unusable behind rendering benches, an endpoint returned 400 while its
      # page was being described. This walks the chain a person actually uses
      # and fails the deploy if any link is broken, so the check does not
      # depend on anyone remembering to look.
      - name: Smoke the vintage chain
        run: python studio/scripts/smoke_vintage.py --base https://studio.shirtfaced.wtf

      # The product design chain, for the same reason. Phase 1 shipped two
      # defects that every unit test, type check and lint pass was happy with:
      # a scorecard endpoint made unreachable by route ordering, and a backlog
      # that listed one library so a concept created from Research was
      # invisible. Both were found by opening the app; this is that check,
      # automated, so the next one is found by a deploy.
      - name: Smoke the design chain
        run: python studio/scripts/smoke_design_chain.py --base https://studio.shirtfaced.wtf
