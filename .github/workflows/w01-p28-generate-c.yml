name: W01-P28 generate C Emma-Brock coverage

on:
  push:
    branches: [main]
    paths:
      - "studio/c-coverage-triggers/*.json"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts
      - name: Place exact C prompt on Studio
        run: |
          scp -i ~/.ssh/deploy_key studio/worlds/world-01/shots/W01-P28C-emma-brock.nano-banana-coverage.txt ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/worlds/world-01/shots/W01-P28C-emma-brock.nano-banana-coverage.txt
      - name: Reject failed combined candidate and generate exactly one C candidate
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/shirtfaced-studio
          set -a
          . .env
          set +a
          ./.venv/bin/python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path
          from app.adapters.asset_store import FilesystemAssetStore
          from app.config import get_settings
          from app.db.session import get_session_factory
          from app.db.visual_models import VisualAsset

          OLD_SHEET = "23ff4d35-dbd8-43bf-a586-9ddba4e1740c"
          PROMPT = "W01-P28C-emma-brock.nano-banana-coverage.txt"
          selections = ["emma:contact_sheet", "brock:contact_sheet"]
          host = os.environ["APP_HOST"]
          if host in {"0.0.0.0", "::", ""}:
              host = "127.0.0.1"
          base = f"http://{host}:{os.environ['APP_PORT']}"

          def request_json(path, method="GET", payload=None, timeout=60):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  base + path, data=data, method=method,
                  headers={"Content-Type": "application/json"} if data is not None else {},
              )
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      raw = response.read().decode("utf-8")
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8")
                  try:
                      body = json.loads(raw) if raw else None
                  except json.JSONDecodeError:
                      body = raw
                  return error.code, body

          prompt_text = Path("worlds/world-01/shots") / PROMPT
          text = prompt_text.read_text(encoding="utf-8")
          for required in (
              "EXACTLY THREE COLUMNS × THREE ROWS",
              "TALL PORTRAIT 9:16 PHONE PHOTOGRAPH",
              "DO NOT make wide/landscape panel images",
              "Damo and the pool-table action are outside every one of these nine phone frames",
          ):
              if required not in text:
                  raise SystemExit(f"C prompt missing guard: {required}")

          reject_status, reject_body = request_json(
              f"/api/contact-sheets/{OLD_SHEET}/reject",
              method="POST",
              payload={
                  "note": "Production QA reject: output cells were landscape rather than portrait-phone views and visual panel contents did not match the numbered panel plan. Split C and D coverage instead.",
                  "actor": "production-qa",
              },
          )
          if reject_status not in {200, 409}:
              raise SystemExit(f"Could not record old-sheet rejection: {reject_status} {reject_body}")

          _, pipeline = request_json("/api/scenes/W01-P28/pipeline")
          if pipeline.get("media_live") is not True:
              raise SystemExit("Google media is not live; refusing to spend")
          available = {one.get("key") for one in pipeline.get("references", []) if isinstance(one, dict)}
          missing = sorted(set(selections) - available)
          if missing:
              raise SystemExit(f"Missing approved C references: {missing}")
          prompts = {one.get("name") for one in pipeline.get("available_prompts", []) if isinstance(one, dict)}
          if PROMPT not in prompts:
              raise SystemExit(f"Studio does not offer exact C prompt {PROMPT}")

          before = int(pipeline.get("attempts", 0))
          status, body = request_json(
              "/api/scenes/W01-P28/generate-sheet",
              method="POST",
              payload={
                  "label": "W01-P28 C Emma-Brock shot-specific coverage",
                  "selections": selections,
                  "aspect_ratio": "16:9",
                  "prompt_name": PROMPT,
              },
              timeout=420,
          )
          _, after_pipeline = request_json("/api/scenes/W01-P28/pipeline")
          after = int(after_pipeline.get("attempts", 0))
          out = Path("var/diagnostics/w01-p28-c")
          out.mkdir(parents=True, exist_ok=True)
          result = {
              "scene": "W01-P28",
              "shot": "C",
              "provider_call_limit": 1,
              "old_combined_sheet_reject_status": reject_status,
              "selections": selections,
              "prompt_name": PROMPT,
              "attempts_before": before,
              "attempts_after": after,
              "attempt_incremented_once": after == before + 1,
              "http_status": status,
              "response": body,
              "human_review_required": True,
              "approved_automatically": False,
          }
          if status == 201 and isinstance(body, dict):
              asset_brief = body.get("asset")
              if isinstance(asset_brief, dict) and asset_brief.get("id"):
                  import uuid
                  asset_id = uuid.UUID(str(asset_brief["id"]))
                  settings = get_settings()
                  store = FilesystemAssetStore(settings.assets_root_resolved)
                  with get_session_factory()() as session:
                      asset = session.get(VisualAsset, asset_id)
                      if asset is None:
                          raise SystemExit(f"C sheet asset {asset_id} missing")
                      suffix = ".png" if asset.mime_type == "image/png" else ".jpg"
                      review = out / f"C-emma-brock-sheet{suffix}"
                      review.write_bytes(store.load(asset.storage_key))
                      result["review_file"] = review.name
                      result["sheet_asset_id"] = str(asset_id)
          (out / "result.json").write_text(json.dumps(result, indent=2, sort_keys=True), encoding="utf-8")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          REMOTE
          mkdir -p w01-p28-c
          scp -i ~/.ssh/deploy_key -r ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/var/diagnostics/w01-p28-c/. w01-p28-c/
          test -s w01-p28-c/result.json
      - name: Upload C review artifact
        uses: actions/upload-artifact@v4
        with:
          name: w01-p28-c-${{ github.run_id }}
          path: w01-p28-c/
          if-no-files-found: error
          retention-days: 1
      - name: Record C result and artifact run
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p studio/worlds/world-01/shots/diagnostics
          cp w01-p28-c/result.json studio/worlds/world-01/shots/diagnostics/W01-P28.c-result.json
          printf '{"run_id":%s,"artifact_name":"w01-p28-c-%s"}\n' '${{ github.run_id }}' '${{ github.run_id }}' > studio/worlds/world-01/shots/diagnostics/W01-P28.c-run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/worlds/world-01/shots/diagnostics/W01-P28.c-result.json studio/worlds/world-01/shots/diagnostics/W01-P28.c-run.json
          git commit -m "chore(W01-P28): record C coverage result [skip ci]"
          git push origin main
