name: Patch Social date pickers once

on:
  push:
    branches: [main]
    paths:
      - "studio/scripts/patch_social_date_pickers.py"
      - ".github/workflows/patch-social-date-pickers-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/web/package-lock.json
      - name: Patch scheduler
        run: python studio/scripts/patch_social_date_pickers.py
      - name: Install
        working-directory: studio/web
        run: npm ci
      - name: Format
        working-directory: studio/web
        run: npx prettier --write src/components/SocialBench.tsx
      - name: Lint
        working-directory: studio/web
        run: npm run lint
      - name: Type check
        working-directory: studio/web
        run: npm run typecheck
      - name: Test
        working-directory: studio/web
        run: npm test -- --run
      - name: Build
        working-directory: studio/web
        run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/web/src/components/SocialBench.tsx
          git commit -m "feat: add date and time pickers to social queue"
          git push
