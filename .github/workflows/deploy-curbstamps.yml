name: Deploy Curb Stamps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "curbstamps-site/**"
      - "curbstamps-admin/**"
      - ".github/workflows/deploy-curbstamps.yml"

permissions:
  contents: write

jobs:
  deploy-curbstamps:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-curbstamps-production
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync curbstamps-admin app
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude=node_modules --exclude=.next --exclude=.env \
            curbstamps-admin/ ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/curbstamps-admin/

      - name: Build and restart curbstamps-admin app
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            'bash /home/ubuntu/curbstamps-admin/deploy/deploy-curbstamps-admin.sh'

      - name: Run curbstamps-admin database migrations
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            'cd /home/ubuntu/curbstamps-admin && npx --yes drizzle-kit migrate'

      - name: Sync curbstamps-site
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude=node_modules --exclude=.next --exclude=out --exclude=.env \
            curbstamps-site/ ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/curbstamps-site/

      - name: Build and restart curbstamps-site
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            'bash /home/ubuntu/curbstamps-site/deploy/deploy-curbstamps-site.sh'

      - name: Verify and capture Oracle state
        run: |
          mkdir -p .runtime
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} 'bash -s' > .runtime/curbstamps-oracle.txt <<'REMOTE'
          set -euo pipefail
          echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "site_service=$(systemctl is-active curbstamps-site)"
          echo "admin_service=$(systemctl is-active curbstamps-admin)"
          echo "site_port_4100=$(ss -ltn | awk '$4 ~ /:4100$/ {print "listening"; found=1} END {if (!found) print "not-listening"}')"
          html=$(curl -fsS http://127.0.0.1:4100/)
          printf '%s' "$html" | grep -q "PICK YOUR WEIRDO"
          echo "homepage_marker=PICK YOUR WEIRDO"
          printf '%s' "$html" | sha256sum | awk '{print "homepage_sha256=" $1}'
          REMOTE
          cat .runtime/curbstamps-oracle.txt

      - name: Record Oracle verification in repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/curbstamps/runtime
          cp .runtime/curbstamps-oracle.txt docs/curbstamps/runtime/oracle-verification.txt
          printf 'source_commit=%s\n' "$GITHUB_SHA" >> docs/curbstamps/runtime/oracle-verification.txt
          git add docs/curbstamps/runtime/oracle-verification.txt
          git commit -m "chore(curbstamps): record Oracle verification" || exit 0
          git push
