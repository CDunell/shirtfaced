name: Studio CI

# Only the Python application under studio/. The repository root is a separate
# Next.js storefront with its own tooling.
on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/studio-ci.yml"
  pull_request:
    paths:
      - "studio/**"
      - ".github/workflows/studio-ci.yml"

defaults:
  run:
    working-directory: studio

jobs:
  quality:
    name: Lint, type check and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, and the version used locally.
        python-version: ["3.12", "3.14"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shirtfaced
          POSTGRES_PASSWORD: shirtfaced
          POSTGRES_DB: shirtfaced_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shirtfaced -d shirtfaced_studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Integration tests run against the service database above.
      TEST_DATABASE_URL: postgresql+psycopg://shirtfaced:shirtfaced@127.0.0.1:5432/shirtfaced_studio
      # The CI container has no TLS; production requires it.
      TEST_DB_SSLMODE: disable
      # No OPENAI_API_KEY is configured. Tests must never call the live API.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy app

      - name: Test
        run: pytest

  web:
    name: Interface
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: studio/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
