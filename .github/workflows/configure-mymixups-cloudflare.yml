name: Configure My Mixups Cloudflare DNS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-mymixups-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN_A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_B: ${{ secrets.CF_API_TOKEN }}
      ORACLE_HOST_VALUE: ${{ secrets.ORACLE_HOST }}
    steps:
      - name: Configure My Mixups DNS, TLS and mail without modifying Curb Stamps
        run: |
          set -euo pipefail
          TOKEN="${CF_TOKEN_A:-${CF_TOKEN_B:-}}"
          if [ -z "$TOKEN" ]; then
            echo 'NO_CLOUDFLARE_API_TOKEN_AVAILABLE'
            exit 42
          fi

          ORIGIN_IP=$(python3 - <<'PY'
          import os,socket
          h=os.environ['ORACLE_HOST_VALUE']
          print(socket.gethostbyname(h))
          PY
          )

          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json')

          zone_id_for() {
            local domain="$1"
            local z
            z=$(curl -fsS "${auth[@]}" "$api/zones?name=$domain&status=active")
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["result"][0]["id"] if d.get("success") and d.get("result") else "")' <<<"$z"
          }

          zone_id=$(zone_id_for mymixups.com)
          test -n "$zone_id"

          upsert() {
            local name="$1" type="$2" content="$3" proxied="$4"
            local priority="${5:-}"
            local existing rid payload
            existing=$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?type=$type&name=$name")
            rid=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["result"][0]["id"] if d.get("result") else "")' <<<"$existing")
            payload=$(python3 - "$type" "$name" "$content" "$proxied" "$priority" <<'PY'
          import json,sys
          p={"type":sys.argv[1],"name":sys.argv[2],"content":sys.argv[3],"ttl":1,"proxied":sys.argv[4].lower()=="true"}
          if sys.argv[5]: p["priority"]=int(sys.argv[5])
          print(json.dumps(p))
          PY
            )
            if [ -n "$rid" ]; then
              curl -fsS -X PUT "${auth[@]}" --data "$payload" "$api/zones/$zone_id/dns_records/$rid" >/dev/null
            else
              curl -fsS -X POST "${auth[@]}" --data "$payload" "$api/zones/$zone_id/dns_records" >/dev/null
            fi
          }

          # Web DNS. These are the only records pointed at Oracle.
          upsert mymixups.com A "$ORIGIN_IP" true
          upsert www.mymixups.com CNAME mymixups.com true
          upsert admin.mymixups.com A "$ORIGIN_IP" true

          # Cloudflare edge TLS: Full mode + HTTPS redirect. This changes My Mixups only.
          curl -fsS -X PATCH "${auth[@]}" --data '{"value":"full"}' "$api/zones/$zone_id/settings/ssl" >/dev/null
          curl -fsS -X PATCH "${auth[@]}" --data '{"value":"on"}' "$api/zones/$zone_id/settings/always_use_https" >/dev/null
          curl -fsS -X PATCH "${auth[@]}" --data '{"value":"on"}' "$api/zones/$zone_id/settings/automatic_https_rewrites" >/dev/null

          # Mail DNS: mirror Curb Stamps' existing mail-provider DNS into My Mixups.
          # Curb Stamps is READ ONLY here: no PUT/PATCH/POST is ever sent to its zone.
          curb_zone_id=$(zone_id_for curbstamps.com)
          if [ -n "$curb_zone_id" ]; then
            records=$(curl -fsS "${auth[@]}" "$api/zones/$curb_zone_id/dns_records?per_page=500")
            python3 - <<'PY' <<<"$records" > /tmp/mymixups-mail-records.tsv
          import json,sys
          d=json.load(sys.stdin)
          for r in d.get('result',[]):
              name=r.get('name','')
              typ=r.get('type','')
              content=r.get('content','')
              mail = (
                  typ == 'MX' or
                  (typ == 'TXT' and (name == 'curbstamps.com' or name.startswith('_dmarc.') or '._domainkey.' in name)) or
                  (typ == 'CNAME' and ('._domainkey.' in name or name.startswith('mail.') or name.startswith('email.')))
              )
              if not mail: continue
              new_name = name.replace('curbstamps.com','mymixups.com')
              new_content = content.replace('curbstamps.com','mymixups.com')
              priority = str(r.get('priority','')) if typ == 'MX' else ''
              print('\t'.join([new_name,typ,new_content,priority]))
          PY
            while IFS=$'\t' read -r name type content priority; do
              [ -n "$name" ] || continue
              upsert "$name" "$type" "$content" false "$priority"
            done < /tmp/mymixups-mail-records.tsv
          fi

          echo "CLOUDFLARE_DNS_CONFIGURED origin=$ORIGIN_IP"
          echo 'CLOUDFLARE_TLS_CONFIGURED=full+https'
          echo 'CURBSTAMPS_ZONE_MODIFIED=false'

      - name: Verify public endpoints and DNS
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            site=$(curl -LksS -o /dev/null -w '%{http_code}' https://mymixups.com/ || true)
            admin=$(curl -LksS -o /dev/null -w '%{http_code}' https://admin.mymixups.com/login || true)
            echo "attempt=$i site=$site admin=$admin"
            if [[ "$site" =~ ^(200|301|302|307|308)$ ]] && [[ "$admin" =~ ^(200|301|302|307|308)$ ]]; then
              echo 'MYMIXUPS_PUBLIC_SITE_OK'
              echo 'MYMIXUPS_PUBLIC_ADMIN_OK'
              exit 0
            fi
            sleep 10
          done
          echo 'PUBLIC_ENDPOINT_VERIFICATION_FAILED'
          exit 1
