name: Build social assets

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-social-assets.mjs"
      - "DEV/logo-lockup.svg"
      - "DEV/shirtfaced.svg"
      - "DEV/smiley.svg"
      - ".github/workflows/build-social-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate assets
        run: node scripts/build-social-assets.mjs
      - name: Commit generated assets
        run: |
          if [ -z "$(git status --porcelain -- public/social-assets)" ]; then
            echo "No social asset changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/social-assets
          git commit -m "build social assets"
          git push
