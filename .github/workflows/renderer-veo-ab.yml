name: Veo approved-master validation
on:
  push:
    branches: [main]
    paths: ["studio/veo-ab-triggers/*.json"]
jobs:
  video:
    runs-on: ubuntu-latest
    concurrency: {group: renderer-veo-approved-master, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts
      - name: Sync code
        run: rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" --exclude=worlds --exclude=var --exclude=assets --exclude=.env --exclude=.venv --exclude=web/node_modules --exclude=web/dist --exclude=__pycache__ --exclude=.pytest_cache studio/ ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/
      - name: Resolve exact uploaded master and run Veo
        id: run
        run: |
          set -euo pipefail
          output=$(ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} 'set -euo pipefail; root=/home/ubuntu/shirtfaced-studio; refdir="$root/var/scene-references/pub-1105"; master=$(find "$refdir" -maxdepth 1 -type f -name "composition-gpt.*" -size +0c -printf "%T@ %p\n" | sort -nr | head -1 | cut -d" " -f2-); test -s "$master"; sha=$(sha256sum "$master" | awk "{print \$1}"); echo APPROVED_MASTER=$master; echo APPROVED_MASTER_SHA256=$sha; result=$($root/.venv/bin/python $root/scripts/run_pub_veo_ab.py --seed "$master" --arm approved-master); dir=$(printf "%s\n" "$result" | sed -n "s/^RESULT_DIR=//p" | tail -1); test -n "$dir"; echo RESULT_DIR=$dir')
          printf '%s\n' "$output"
          echo "result_dir=$(printf '%s\n' "$output" | sed -n 's/^RESULT_DIR=//p' | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Retrieve result
        run: |
          mkdir -p veo-result
          scp -i ~/.ssh/deploy_key -r ubuntu@${{ secrets.ORACLE_HOST }}:"${{ steps.run.outputs.result_dir }}/." veo-result/
          test -s veo-result/video-1.mp4; test -s veo-result/manifest.json
          grep -q '"experiment": "approved-master-direct-silent-veo"' veo-result/manifest.json
          grep -q '"audio": "stripped_for_post"' veo-result/manifest.json
          ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 veo-result/video-1.mp4 | test ! -s /dev/stdin
      - uses: actions/upload-artifact@v4
        with: {name: pub-1105-approved-master-veo-silent, path: veo-result/, if-no-files-found: error, retention-days: 7}
