name: Patch Social delivery once

on:
  push:
    branches: [main]
    paths:
      - "studio/scripts/patch_social_delivery_once.py"
      - ".github/workflows/patch-social-delivery-once.yml"

permissions:
  contents: write

defaults:
  run:
    working-directory: studio

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shirtfaced
          POSTGRES_PASSWORD: shirtfaced
          POSTGRES_DB: shirtfaced_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shirtfaced -d shirtfaced_studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://shirtfaced:shirtfaced@127.0.0.1:5432/shirtfaced_studio
      TEST_DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/web/package-lock.json
      - name: Apply delivery patch
        run: |
          python scripts/patch_social_delivery_once.py
          sed -i 's/PublicationState, SocialPost, SocialPostState/PublicationState, SocialPostState/' app/services/social_delivery.py
          python - <<'PY'
          from pathlib import Path
          path = Path("app/db/social_models.py")
          text = path.read_text()
          old = '        Index("ix_publication_jobs_state_scheduled_at", "state", "scheduled_at"),\n'
          new = old + '        Index("ix_publication_jobs_retry_due", "state", "next_attempt_at"),\n'
          if old not in text:
              raise SystemExit("publication job table args not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Format Python
        run: ruff format app tests scripts/run_social_publish_queue.py
      - name: Lint Python
        run: ruff check app tests scripts/run_social_publish_queue.py
      - name: Type check Python
        run: mypy app
      - name: Migrate test database
        run: |
          psql "postgresql://shirtfaced:shirtfaced@127.0.0.1:5432/shirtfaced_studio" -c "CREATE EXTENSION IF NOT EXISTS vector"
          DATABASE_URL="$TEST_DATABASE_URL" DB_SSLMODE=disable alembic upgrade head
      - name: Test delivery contracts
        run: >-
          pytest -q
          tests/integration/test_social_publishing_api.py
          tests/integration/test_migrations.py::test_models_match_the_migrated_schema
      - name: Install web
        working-directory: studio/web
        run: npm ci
      - name: Format web
        working-directory: studio/web
        run: npx prettier --write src/api/social.ts src/components/SocialBench.tsx
      - name: Lint web
        working-directory: studio/web
        run: npm run lint
      - name: Type check web
        working-directory: studio/web
        run: npm run typecheck
      - name: Test web
        working-directory: studio/web
        run: npm test -- --run
      - name: Build web
        working-directory: studio/web
        run: npm run build
      - name: Commit implementation
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio docs/stage-2/SOCIAL_PUBLISHING_IMPLEMENTATION_SCOPE.md
          git commit -m "feat: automate due social publishing with retries"
          git push
