name: Box check

# Read-only Oracle diagnostic workflow, manual only. Curb Stamps deploys
# (both curbstamps-site and curbstamps-admin) run from deploy.yml on every
# push to main, same pipeline as shirtfaced-admin/site/studio — that was the
# push trigger this workflow briefly carried too, which raced deploy.yml's
# own curbstamps-site build in the same directory on every push (two
# `npm ci && npm run build` runs against /home/ubuntu/curbstamps-site at
# once). Removed rather than left as a second, partial (curbstamps-admin was
# never covered here) deployer. deploy-curbstamps.yml remains as a manual-only
# fallback for curbstamps specifically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Look
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} 'bash -s' <<'REMOTE'
          set -u
          echo "===== listening ====="
          ss -ltnp 2>/dev/null | sed 's/users:.*pid=/pid=/'
          echo
          echo "===== services ====="
          systemctl list-units --type=service --state=running --no-pager --no-legend |
            grep -Ei 'shirtfaced|curbstamps|studio|uvicorn|cloudflared|nginx|postgres' || echo "(none matched)"
          echo
          echo "===== /home/ubuntu ====="
          ls -1 /home/ubuntu
          echo
          echo "===== databases ====="
          sudo -u postgres psql -tAc "select datname from pg_database where datname not like 'template%'" 2>/dev/null
          echo
          echo "===== cloudflared ingress ====="
          sudo cat /etc/cloudflared/config.yml 2>/dev/null || echo "(no config)"
          REMOTE
