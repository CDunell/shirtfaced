name: Box check

# Existing Oracle access workflow. Manual runs remain read-only; Curb Stamps
# pushes use the same proven SSH path to deploy and verify the separate app.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "curbstamps-site/**"
      - "curbstamps-admin/**"
      - ".github/workflows/box-check.yml"

jobs:
  check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Look
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} 'bash -s' <<'REMOTE'
          set -u
          echo "===== listening ====="
          ss -ltnp 2>/dev/null | sed 's/users:.*pid=/pid=/'
          echo
          echo "===== services ====="
          systemctl list-units --type=service --state=running --no-pager --no-legend |
            grep -Ei 'shirtfaced|curbstamps|studio|uvicorn|cloudflared|nginx|postgres' || echo "(none matched)"
          echo
          echo "===== /home/ubuntu ====="
          ls -1 /home/ubuntu
          echo
          echo "===== databases ====="
          sudo -u postgres psql -tAc "select datname from pg_database where datname not like 'template%'" 2>/dev/null
          echo
          echo "===== cloudflared ingress ====="
          sudo cat /etc/cloudflared/config.yml 2>/dev/null || echo "(no config)"
          REMOTE

  deploy-curbstamps:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-curbstamps-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync Curb Stamps site
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude=node_modules --exclude=.next --exclude=out --exclude=.env \
            curbstamps-site/ ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/curbstamps-site/

      - name: Build and restart Curb Stamps site
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            'bash /home/ubuntu/curbstamps-site/deploy/deploy-curbstamps-site.sh'

      - name: Verify Oracle is serving current homepage
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          systemctl is-active --quiet curbstamps-site
          html=$(curl -fsS http://127.0.0.1:4100/)
          printf '%s' "$html" | grep -q "PICK YOUR WEIRDO"
          printf '%s' "$html" | grep -q "THE WHOLE CURB CREW"
          echo "Curb Stamps verified on Oracle"
          REMOTE
