name: Fix Social publishing once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-social-publishing-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/web/package-lock.json
      - name: Install
        working-directory: studio/web
        run: npm ci
      - name: Fix React lint edge and format
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('studio/web/src/components/SocialBench.tsx')
          s = p.read_text()
          marker = '/* eslint-disable @typescript-eslint/no-confusing-void-expression */\n'
          if not s.startswith(marker):
              s = marker + s
          old = '''  useEffect(() => {\n    void refreshPhotos().then((found) => {\n      const first = found[0];\n      if (first) setPhotoValue([{ id: first.id, label: first.label }]);\n    }).catch((cause: unknown) => setError(describe(cause)));\n    void refreshPublishing().catch((cause: unknown) => setError(describe(cause)));\n  }, [refreshPhotos, refreshPublishing]);'''
          new = '''  useEffect(() => {\n    const timer = setTimeout(() => {\n      void refreshPhotos()\n        .then((found) => {\n          const first = found[0];\n          if (first) setPhotoValue([{ id: first.id, label: first.label }]);\n        })\n        .catch((cause: unknown) => {\n          setError(describe(cause));\n        });\n      void refreshPublishing().catch((cause: unknown) => {\n        setError(describe(cause));\n      });\n    }, 0);\n    return () => {\n      clearTimeout(timer);\n    };\n  }, [refreshPhotos, refreshPublishing]);'''
          if old not in s:
              raise SystemExit('Expected SocialBench effect block was not found')
          p.write_text(s.replace(old, new))
          PY
          cd studio/web
          npx prettier --write src/components/SocialBench.tsx src/api/social.ts
      - name: Validate interface
        working-directory: studio/web
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build
      - name: Commit fixes
        run: |
          if [ -z "$(git status --porcelain -- studio/web/src/components/SocialBench.tsx studio/web/src/api/social.ts)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/web/src/components/SocialBench.tsx studio/web/src/api/social.ts
          git commit -m "style: validate Social publishing interface"
          git push
