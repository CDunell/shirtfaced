name: Renderer result retrieval
on:
  push:
    branches: [main]
    paths: ["studio/retrieval-triggers/*.json"]
jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts
      - name: Retrieve Damo canonical references
        run: |
          set -euo pipefail
          mkdir -p renderer-result/damo
          scp -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/var/cast/damo/a-full-length.png renderer-result/damo/
          scp -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/var/cast/damo/b-head-shoulders.png renderer-result/damo/
          test -s renderer-result/damo/a-full-length.png
          test -s renderer-result/damo/b-head-shoulders.png
      - uses: actions/upload-artifact@v4
        with:
          name: damo-canonical-refs
          path: renderer-result/damo/
          if-no-files-found: error
          retention-days: 1
