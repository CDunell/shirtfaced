name: Renderer result retrieval
on:
  push:
    branches: [main]
    paths: ["studio/retrieval-triggers/*.json"]
jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts
      - name: Retrieve localized Damo package
        run: |
          set -euo pipefail
          mkdir -p renderer-result
          scp -i ~/.ssh/deploy_key -r ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/var/renderer-validation/pub-1105/20260816T125421Z/. renderer-result/
          test -s renderer-result/manifest.json
          test -s renderer-result/prompt.txt
          test -s renderer-result/seed-1.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: pub-1105-localized-damo-result
          path: renderer-result/
          if-no-files-found: error
          retention-days: 7
