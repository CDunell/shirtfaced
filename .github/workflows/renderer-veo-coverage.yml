name: Pub coverage Veo validation
on:
  push:
    branches: [main]
    paths: ["studio/veo-coverage-triggers/*.json"]
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    concurrency: {group: renderer-veo-coverage, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 2}
      - name: Read trigger
        id: trigger
        run: |
          set -euo pipefail
          mapfile -t triggers < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'studio/veo-coverage-triggers/*.json')
          test "${#triggers[@]}" -eq 1
          trigger="${triggers[0]}"
          test -s "$trigger"
          scene=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["scene"])' "$trigger")
          shot=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["shot"])' "$trigger")
          human_approved=$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1])).get("human_approved", False)).lower())' "$trigger")
          inspect_only=$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1])).get("inspect_only", False)).lower())' "$trigger")
          echo "scene=$scene" >> "$GITHUB_OUTPUT"
          echo "shot=$shot" >> "$GITHUB_OUTPUT"
          echo "human_approved=$human_approved" >> "$GITHUB_OUTPUT"
          echo "inspect_only=$inspect_only" >> "$GITHUB_OUTPUT"
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts
      - name: Inspect existing Studio takes without provider call
        if: steps.trigger.outputs.inspect_only == 'true'
        run: |
          set -euo pipefail
          mkdir -p studio/veo-coverage-results
          scene='${{ steps.trigger.outputs.scene }}'
          shot='${{ steps.trigger.outputs.shot }}'
          out="studio/veo-coverage-results/${GITHUB_RUN_ID}-${shot}.json"
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} "ROOT=/home/ubuntu/shirtfaced-studio SCENE='$scene' SHOT='$shot' python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])/'var/renderer-validation'/os.environ['SCENE']
          shot=os.environ['SHOT']
          rows=[]
          if root.exists():
              for d in sorted(root.glob(f'*-coverage-{shot}')):
                  manifest=d/'manifest.json'
                  probe=d/'probe.json'
                  video=d/'video-1.mp4'
                  row={'directory':str(d),'video_exists':video.is_file(),'video_bytes':video.stat().st_size if video.is_file() else None}
                  if manifest.is_file():
                      try: row['manifest']=json.loads(manifest.read_text())
                      except Exception as e: row['manifest_error']=str(e)
                  if probe.is_file():
                      try: row['probe']=json.loads(probe.read_text())
                      except Exception as e: row['probe_error']=str(e)
                  rows.append(row)
          print(json.dumps({'scene':os.environ['SCENE'],'shot':shot,'provider_called':False,'take_count':len(rows),'takes':rows}, indent=2))
          PY" > "$out"
          cat "$out"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out"
          git commit -m "chore(renderer): record Veo take inspection [skip ci]"
          git push origin HEAD:main
      - name: Retrieve existing take for inspection
        if: steps.trigger.outputs.inspect_only == 'true'
        run: |
          set -euo pipefail
          scene='${{ steps.trigger.outputs.scene }}'
          shot='${{ steps.trigger.outputs.shot }}'
          latest=$(ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} "ls -1dt /home/ubuntu/shirtfaced-studio/var/renderer-validation/$scene/*-coverage-$shot 2>/dev/null | head -1")
          test -n "$latest"
          mkdir -p veo-result
          scp -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }}:"$latest/video-1.mp4" veo-result/video-1.mp4
          scp -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }}:"$latest/manifest.json" veo-result/manifest.json
          scp -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }}:"$latest/probe.json" veo-result/probe.json
          scp -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }}:"$latest/motion-prompt.txt" veo-result/motion-prompt.txt
          test -s veo-result/video-1.mp4
      - name: Upload inspected existing take
        if: steps.trigger.outputs.inspect_only == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: w01-p28-a-existing-veo-take
          path: veo-result/
          if-no-files-found: error
          retention-days: 7
      - name: Install ffmpeg
        if: steps.trigger.outputs.inspect_only != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install exact runner on Studio
        if: steps.trigger.outputs.inspect_only != 'true'
        run: |
          scp -i ~/.ssh/deploy_key studio/scripts/run_pub_coverage_veo.py ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/scripts/run_pub_coverage_veo.py
      - name: Approve reviewed frame and run one Lite take
        if: steps.trigger.outputs.inspect_only != 'true'
        id: run
        run: |
          set -euo pipefail
          test '${{ steps.trigger.outputs.human_approved }}' = 'true'
          scene='${{ steps.trigger.outputs.scene }}'
          shot='${{ steps.trigger.outputs.shot }}'
          output=$(ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} "set -euo pipefail; root=/home/ubuntu/shirtfaced-studio; cd \"\$root\"; set -a; . .env; set +a; \$root/.venv/bin/python -m app.cli coverage '$scene' --approve '$shot'; result=\$(\$root/.venv/bin/python \$root/scripts/run_pub_coverage_veo.py --shot '$shot' --scene '$scene'); dir=\$(printf '%s\\n' \"\$result\" | sed -n 's/^RESULT_DIR=//p' | tail -1); test -n \"\$dir\"; echo RESULT_DIR=\$dir")
          printf '%s\n' "$output"
          echo "result_dir=$(printf '%s\n' "$output" | sed -n 's/^RESULT_DIR=//p' | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Retrieve raw generation and strip audio
        if: steps.trigger.outputs.inspect_only != 'true'
        run: |
          set -euo pipefail
          mkdir -p veo-result
          scp -i ~/.ssh/deploy_key -r ubuntu@${{ secrets.ORACLE_HOST }}:"${{ steps.run.outputs.result_dir }}/." veo-result/
          test -s veo-result/video-generated.mp4
          test -s veo-result/manifest.json
          test -s veo-result/motion-prompt.txt
          ffmpeg -y -i veo-result/video-generated.mp4 -map 0:v:0 -c:v copy -an veo-result/video-1.mp4
          test -s veo-result/video-1.mp4
          ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 veo-result/video-1.mp4 | test ! -s /dev/stdin
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of json veo-result/video-1.mp4 > veo-result/probe.json
          sha256sum veo-result/video-1.mp4 > veo-result/video-1.sha256
      - name: Upload generated take
        if: steps.trigger.outputs.inspect_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pub-1105-coverage-veo-lite
          path: veo-result/
          if-no-files-found: error
          retention-days: 7
