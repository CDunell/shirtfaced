name: Approved Veo pub validation
on:
  push:
    branches: [main]
    paths: ["studio/video-validation-triggers/*.json"]
jobs:
  video:
    runs-on: ubuntu-latest
    concurrency: {group: renderer-video-validation, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts
      - name: Sync exact triggering Studio code
        run: |
          set -euo pipefail
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" --exclude=worlds --exclude=var --exclude=assets --exclude=.env --exclude=.venv --exclude=web/node_modules --exclude=web/dist --exclude=__pycache__ --exclude=.pytest_cache studio/ ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/
      - name: Run one approved Veo I2V candidate
        id: generate
        run: |
          set -euo pipefail
          seed=/home/ubuntu/shirtfaced-studio/var/renderer-validation/pub-1105/20260816T130347Z/seed-1.jpg
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} "test -s $seed"
          output=$(ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} "/home/ubuntu/shirtfaced-studio/.venv/bin/python /home/ubuntu/shirtfaced-studio/scripts/run_renderer_video.py --seed $seed")
          printf '%s\n' "$output"
          result_dir=$(printf '%s\n' "$output" | sed -n 's/^RESULT_DIR=//p' | tail -1)
          test -n "$result_dir"
          echo "result_dir=$result_dir" >> "$GITHUB_OUTPUT"
      - name: Retrieve video package
        run: |
          mkdir -p renderer-video
          scp -i ~/.ssh/deploy_key -r ubuntu@${{ secrets.ORACLE_HOST }}:"${{ steps.generate.outputs.result_dir }}/." renderer-video/
          test -s renderer-video/video-1.mp4
          test -s renderer-video/manifest.json
          test -s renderer-video/motion-prompt.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pub-1105-veo-approved-seed
          path: renderer-video/
          if-no-files-found: error
          retention-days: 7
