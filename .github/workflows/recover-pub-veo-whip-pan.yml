name: Recover pub whip-pan Veo artifact
on:
  push:
    branches: [main]
    paths: ["studio/veo-whip-pan-recovery-triggers/*.json"]
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts
      - name: Recover already-generated raw video without regenerating
        run: |
          set -euo pipefail
          mkdir -p veo-result
          remote=$(ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} 'find /home/ubuntu/shirtfaced-studio/var/renderer-validation/pub-1105 -path "*-veo-whip-pan/video-generated.mp4" -type f -printf "%T@ %p\n" | sort -nr | head -1 | cut -d" " -f2-')
          test -n "$remote"
          scp -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }}:"$remote" veo-result/video-generated.mp4
          test -s veo-result/video-generated.mp4
          ffmpeg -y -i veo-result/video-generated.mp4 -map 0:v:0 -c:v copy -an veo-result/video-1.mp4
          test -s veo-result/video-1.mp4
          test -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 veo-result/video-1.mp4)"
          sha256sum veo-result/video-1.mp4 > veo-result/video-1.sha256
          printf '%s\n' '{"scene":"pub-1105","shot":"1C-whip-pan-damo-to-emma-brock","experiment":"wide-master-spatial-whip-pan-silent-veo","model":"veo-3.1-lite-generate-preview","aspect_ratio":"9:16","resolution":"720p","seed_sha256":"81290e2f235fea134e6bcf6d40bab79a475474f544925bd6b87d4bb46b615963","audio":"stripped_for_post","recovered_after_server_ffmpeg_missing":true}' > veo-result/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: pub-1105-whip-pan-veo-lite-recovered
          path: veo-result/
          if-no-files-found: error
          retention-days: 7
