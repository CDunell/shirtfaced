name: Format Social Studio once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-social-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/web/package-lock.json
      - name: Install
        working-directory: studio/web
        run: npm ci
      - name: Format
        working-directory: studio/web
        run: npx prettier --write src/App.tsx src/components/SocialBench.tsx
      - name: Validate interface
        working-directory: studio/web
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build
      - name: Commit formatting
        run: |
          if [ -z "$(git status --porcelain -- studio/web/src/App.tsx studio/web/src/components/SocialBench.tsx)" ]; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/web/src/App.tsx studio/web/src/components/SocialBench.tsx
          git commit -m "style: format Social Studio"
          git push
