name: Collect next 100 vintage eBay references

on:
  push:
    branches: [main]
    paths:
      - 'docs/research/vintage-market-evidence/requests/next100.txt'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      REMOTE_RUN_DIR: /home/ubuntu/vintage-next100-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts
      - name: Stage browser collector and evidence on Oracle
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            "mkdir -p '$REMOTE_RUN_DIR/docs/research/vintage-market-evidence/batches' '$REMOTE_RUN_DIR/scripts'"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            scripts/collect-vintage-ebay-next100-browser.mjs \
            ubuntu@${{ secrets.ORACLE_HOST }}:"$REMOTE_RUN_DIR/scripts/"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            docs/research/vintage-market-evidence/ \
            ubuntu@${{ secrets.ORACLE_HOST }}:"$REMOTE_RUN_DIR/docs/research/vintage-market-evidence/"
      - name: Install Chromium runtime on Oracle
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} "bash -s" <<REMOTE
          set -euo pipefail
          cd "$REMOTE_RUN_DIR"
          test -f package.json || npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          sudo npx playwright install-deps chromium >/dev/null
          npx playwright install chromium >/dev/null
          REMOTE
      - name: Start detached collector
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} "bash -s" <<REMOTE
          set -euo pipefail
          cd "$REMOTE_RUN_DIR"
          rm -f exit.code collector.log
          nohup bash -lc '
            node scripts/collect-vintage-ebay-next100-browser.mjs > collector.log 2>&1
            echo \$? > exit.code
          ' >/dev/null 2>&1 < /dev/null &
          REMOTE
      - name: Wait for collector
        run: |
          for i in $(seq 1 220); do
            status=$(ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
              "if [ -f '$REMOTE_RUN_DIR/exit.code' ]; then cat '$REMOTE_RUN_DIR/exit.code'; else echo RUNNING; fi")
            if [ "$status" != "RUNNING" ]; then
              ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} "cat '$REMOTE_RUN_DIR/collector.log'"
              test "$status" = "0"
              exit
            fi
            sleep 12
          done
          echo 'collector did not finish before poll limit' >&2
          exit 1
      - name: Pull generated batch
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            ubuntu@${{ secrets.ORACLE_HOST }}:"$REMOTE_RUN_DIR/docs/research/vintage-market-evidence/batches/ebay-sold-next100-browser-2026-08-13.jsonl" \
            docs/research/vintage-market-evidence/batches/
          test "$(wc -l < docs/research/vintage-market-evidence/batches/ebay-sold-next100-browser-2026-08-13.jsonl)" -eq 100
      - name: Commit batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/vintage-market-evidence/batches/ebay-sold-next100-browser-2026-08-13.jsonl
          git commit -m 'add 100 Chromium-verified vintage eBay sold references'
          git pull --rebase origin main
          git push
