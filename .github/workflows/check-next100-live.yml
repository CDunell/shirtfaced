name: Check vintage checkpoint live
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-next100-live.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts
      - name: Inspect collector
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} 'bash -s' <<'REMOTE'
          D=/home/ubuntu/vintage-next100-31656617081
          echo '=== STATUS ==='
          if [ -f "$D/exit.code" ]; then cat "$D/exit.code"; else echo RUNNING; fi
          echo '=== VERIFIED COUNT ==='
          grep -Ec '^[0-9]+/15 ' "$D/collector.log" 2>/dev/null || true
          echo '=== LOG TAIL ==='
          tail -80 "$D/collector.log" 2>/dev/null || true
          REMOTE
