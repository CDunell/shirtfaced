name: Paid Veo validation
on:
  push:
    branches: [main]
    paths: ["studio/video-validation-triggers/*.json"]
jobs:
  video:
    runs-on: ubuntu-latest
    concurrency:
      group: renderer-paid-video-validation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts
      - name: Sync exact triggering Studio code
        run: |
          set -euo pipefail
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" --exclude=worlds --exclude=var --exclude=assets --exclude=.env --exclude=.venv --exclude=web/node_modules --exclude=web/dist --exclude=__pycache__ --exclude=.pytest_cache studio/ ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/shirtfaced-studio/
      - name: Locate approved vertical seed and run one Veo candidate
        id: generate
        run: |
          set -euo pipefail
          output=$(ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} 'set -euo pipefail; root=/home/ubuntu/shirtfaced-studio/var/renderer-validation/pub-1105; seed=$(find "$root" -type f \( -name "seed-1.jpg" -o -name "seed-1.png" \) -printf "%T@ %p\n" | sort -nr | head -1 | cut -d" " -f2-); test -n "$seed"; manifest=$(dirname "$seed")/manifest.json; grep -q '"aspect_ratio": "9:16"' "$manifest"; /home/ubuntu/shirtfaced-studio/.venv/bin/python /home/ubuntu/shirtfaced-studio/scripts/run_renderer_video.py --seed "$seed"')
          printf '%s\n' "$output"
          result_dir=$(printf '%s\n' "$output" | sed -n 's/^RESULT_DIR=//p' | tail -1); test -n "$result_dir"; echo "result_dir=$result_dir" >> "$GITHUB_OUTPUT"
      - name: Retrieve video package
        run: |
          mkdir -p renderer-video-result
          scp -i ~/.ssh/deploy_key -r ubuntu@${{ secrets.ORACLE_HOST }}:"${{ steps.generate.outputs.result_dir }}/." renderer-video-result/
          test -s renderer-video-result/video-1.mp4
          test -s renderer-video-result/manifest.json
          grep -q '"aspect_ratio": "9:16"' renderer-video-result/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: pub-1105-veo
          path: renderer-video-result/
          if-no-files-found: error
          retention-days: 7
