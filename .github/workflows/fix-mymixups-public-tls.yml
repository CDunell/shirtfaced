name: Fix My Mixups Public TLS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-mymixups-public-tls.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Discover usable Cloudflare credential without exposing it
        id: discover
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} 'bash -s' <<'REMOTE' > /tmp/discovery.txt
          set +e
          python3 - <<'PY'
          import os,re,subprocess,json
          roots=['/home/ubuntu','/etc/cloudflared','/etc/systemd/system']
          rx=re.compile(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+?)\s*$')
          wanted=re.compile(r'(CLOUDFLARE|CF_(?:API|TOKEN|KEY)|ORIGIN_CA)',re.I)
          found=[]
          for root in roots:
              if not os.path.exists(root): continue
              for dp,dns,fns in os.walk(root):
                  dns[:] = [d for d in dns if d not in {'.git','node_modules','.next','cache','logs'}]
                  for fn in fns:
                      p=os.path.join(dp,fn)
                      try:
                          if os.path.getsize(p)>1048576: continue
                          for line in open(p,'r',errors='ignore'):
                              m=rx.match(line)
                              if not m or not wanted.search(m.group(1)): continue
                              key=m.group(1); val=m.group(2).strip().strip('"\'')
                              if not val or '$' in val: continue
                              found.append((p,key,val))
                      except Exception: pass
          print('candidate_count='+str(len(found)))
          usable=False
          for p,key,val in found:
              print('candidate='+p+':'+key)
              if 'SERVICE' in key.upper() or 'ORIGIN' in key.upper():
                  continue
              try:
                  out=subprocess.check_output(['curl','-sS','-H','Authorization: Bearer '+val,'https://api.cloudflare.com/client/v4/zones?name=mymixups.com'],text=True,timeout=12)
                  d=json.loads(out)
                  if d.get('success') and d.get('result'):
                      print('usable_token=true')
                      print('usable_source='+p+':'+key)
                      print('zone_id_available=true')
                      usable=True
                      break
              except Exception:
                  pass
          if not usable:
              print('usable_token=false')
          PY
          REMOTE

      - name: Record live state
        if: always()
        run: |
          root=$(curl -LsS -o /dev/null -w '%{http_code}' https://mymixups.com/ || true)
          www=$(curl -LsS -o /dev/null -w '%{http_code}' https://www.mymixups.com/ || true)
          admin=$(curl -LsS -o /dev/null -w '%{http_code}' https://admin.mymixups.com/login || true)
          curb=$(curl -LsS -o /dev/null -w '%{http_code}' https://curbstamps.com/ || true)
          {
            cat /tmp/discovery.txt 2>/dev/null || true
            echo "root_http=$root"
            echo "www_http=$www"
            echo "admin_http=$admin"
            echo "curb_http=$curb"
            echo "admin_dns=$(dig +short admin.mymixups.com | tr '\n' ' ')"
            echo "checked_at=$(date -u +%FT%TZ)"
          } > .github/mymixups-public-tls-status.txt

      - name: Publish result
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/mymixups-public-tls-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Cloudflare credential discovery"
            git push
          fi
