name: Authorize owner key

# One-off, manual only: puts the owner's workstation public key on the box so
# the design corpora can be transferred from the machine that holds them.
# The key below is a PUBLIC key — safe in the repo. Remove this workflow after
# it has run; the audit branch's docs record why it existed.
on:
  workflow_dispatch:

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Append the key, idempotently
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} 'bash -s' <<'REMOTE'
          set -eu
          KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIUhLTjXC6TyjLhrl9F4RgkdxT3pHio0VDFUy2VqYEXt user@CRYPTO-ENGINE"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          if grep -qxF "$KEY" ~/.ssh/authorized_keys; then
            echo "already authorized"
          else
            echo "$KEY" >> ~/.ssh/authorized_keys
            echo "key appended"
          fi
          wc -l ~/.ssh/authorized_keys
          REMOTE
