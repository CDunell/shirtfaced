<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title>It's on the way.</title>
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse; }
    img { border: 0; height: auto; display: block; }
    body { margin: 0 !important; padding: 0 !important; background-color: #0a0a0a; }
    a { text-decoration: none; }
    .display { font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', Arial, sans-serif; font-weight: 900; letter-spacing: -0.03em; text-transform: uppercase; line-height: 0.9; }
    .body-text { font-family: Arial, Helvetica, sans-serif; line-height: 1.5; color: #111; }
    .small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #333; }
    @media only screen and (max-width: 620px) {
      .shell { width: 100% !important; }
      .pad { padding-left: 20px !important; padding-right: 20px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#0a0a0a;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">It's on the way. Let's go.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0a0a0a;">
    <tr><td align="center">
      <table role="presentation" class="shell" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background:#F5F0E6;">
        
        <tr>
          <td style="background:#000;padding:18px 24px;">
            <span class="display" style="font-size:28px;color:#fff;">shirtfaced</span>
            <span style="display:inline-block;width:26px;height:26px;background:#C8FF1A;border-radius:50%;margin-left:6px;vertical-align:middle;text-align:center;line-height:26px;font-size:14px;">☺</span>
          </td>
        </tr>

        <tr>
          <td class="pad" style="padding:36px 32px 24px;background:#F5F0E6;">
            <div class="display" style="font-size:42px;color:#000;margin-bottom:8px;">
              IT'S ON<br>THE WAY.
            </div>
            <div class="body-text" style="font-size:16px;color:#333;margin-bottom:24px;">
              Let's go.
            </div>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:2px solid #111;background:#fff;margin-bottom:24px;">
              <tr>
                <td style="padding:16px;" class="body-text">
                  <div style="font-size:13px;margin-bottom:8px;"><strong>ORDER #{{ order_number }}</strong></div>
                  <div style="font-size:13px;margin-bottom:4px;">TRACKING</div>
                  <div style="font-size:14px;font-weight:bold;letter-spacing:0.5px;">{{ tracking_number }}</div>
                  <div class="small" style="margin-top:8px;">{{ carrier_name }} · Est. {{ estimated_delivery }}</div>
                </td>
              </tr>
              <tr>
                <td style="padding:12px 16px;border-top:1px solid #eee;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td width="70">
                        <img src="https://placehold.co/60x70/111/C8FF1A?text=TEE" width="60" alt="Product">
                      </td>
                      <td class="body-text" style="padding-left:12px;">
                        <div style="font-weight:bold;font-size:14px;">OG TEE – BLACK</div>
                        <div class="small">Large · Qty: 1</div>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="background:#C8FF1A;">
                  <a href="{{ tracking_url }}" style="display:inline-block;padding:14px 28px;font-family:Impact,'Arial Black',Arial,sans-serif;font-size:15px;color:#000;text-transform:uppercase;letter-spacing:1px;">TRACK PACKAGE →</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="background:#000;padding:22px;text-align:center;">
            <div style="font-family:Arial,sans-serif;font-size:13px;color:#C8FF1A;font-weight:bold;">SHIRTFACED.WTF</div>
            <div class="small" style="color:#777;font-size:11px;margin-top:4px;"><a href="{{ unsubscribe_url }}" style="color:#777;text-decoration:underline;">UNSUBSCRIBE</a></div>
            <div class="display" style="font-size:11px;color:#C8FF1A;margin-top:12px;">GOOD MATES, GREAT TIMES, SHIRTFACED.</div>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
