<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title>Left something behind?</title>
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse; }
    img { border: 0; height: auto; display: block; }
    body { margin: 0 !important; padding: 0 !important; background-color: #0d0d0d; }
    a { text-decoration: none; }
    .display { font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', Arial, sans-serif; font-weight: 900; letter-spacing: -0.03em; text-transform: uppercase; line-height: 0.9; }
    .body-text { font-family: Arial, Helvetica, sans-serif; line-height: 1.5; color: #111; }
    .small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #333; }
    @media only screen and (max-width: 620px) {
      .shell { width: 100% !important; }
      .hero-title { font-size: 36px !important; }
      .pad { padding-left: 20px !important; padding-right: 20px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#0d0d0d;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Your cart is waiting. Hesitation is the only thing that sells out.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0d0d0d;">
    <tr><td align="center">
      <table role="presentation" class="shell" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background:#F5F0E6;">
        
        <tr>
          <td style="background:#000;padding:18px 24px;">
            <span class="display" style="font-size:28px;color:#ffffff;">shirtfaced</span>
            <span style="display:inline-block;width:26px;height:26px;background:#B9EC29;border-radius:50%;margin-left:6px;vertical-align:middle;text-align:center;line-height:26px;font-size:14px;">☺</span>
          </td>
        </tr>

        <tr>
          <td class="pad" style="padding:40px 32px 28px;background:#F5F0E6;">
            <div class="display hero-title" style="font-size:42px;color:#000;margin-bottom:8px;">
              LEFT SOMETHING<br>BEHIND?
            </div>
            <div style="width:120px;height:6px;background:#B9EC29;margin:10px 0 18px;"></div>
            <div class="body-text" style="font-size:16px;color:#333;margin-bottom:28px;">
              Your cart is waiting.
            </div>

            <!-- Cart item -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;border:2px solid #111;margin-bottom:24px;">
              <tr>
                <td width="110" style="padding:14px;">
                  <img src="https://placehold.co/90x100/0d0d0d/B9EC29?text=TEE" width="90" alt="OG Tee" style="width:90px;">
                </td>
                <td style="padding:14px 14px 14px 0;" class="body-text">
                  <div style="font-weight:bold;font-size:15px;">OG TEE – BLACK</div>
                  <div class="small" style="margin-top:4px;">Large</div>
                  <div style="font-size:15px;margin-top:6px;font-weight:bold;">$39.99</div>
                  <div class="small">Qty: 1</div>
                </td>
              </tr>
            </table>

            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:20px;">
              <tr>
                <td style="background:#000;">
                  <a href="{{ primary_url }}" style="display:inline-block;padding:14px 28px;font-family:Impact,'Arial Black',Arial,sans-serif;font-size:15px;color:#B9EC29;text-transform:uppercase;letter-spacing:1px;">RETURN TO CART →</a>
                </td>
              </tr>
            </table>

            <div style="background:#111;color:#B9EC29;padding:12px 16px;display:inline-block;font-family:Arial,sans-serif;font-size:13px;font-weight:bold;">
              HESITATION IS THE ONLY THING THAT SELLS OUT. ☺
            </div>
          </td>
        </tr>

        <tr>
          <td style="background:#000;padding:22px;text-align:center;">
            <div style="font-family:Arial,sans-serif;font-size:13px;color:#B9EC29;font-weight:bold;">SHIRTFACED.WTF</div>
            <div class="small" style="color:#777;font-size:11px;margin-top:4px;"><a href="{{ unsubscribe_url }}" style="color:#777;text-decoration:underline;">UNSUBSCRIBE</a></div>
            <div class="display" style="font-size:11px;color:#B9EC29;margin-top:12px;">GOOD MATES, GREAT TIMES, SHIRTFACED.</div>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
