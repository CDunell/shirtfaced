[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shirtfaced-studio"
version = "0.1.0"
description = "Local-first creative production application for Shirtfaced photographic worlds"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "openai>=1.50",
  "google-genai>=1.0",
  "pillow>=10.4",
  "numpy>=2.0",
  "pgvector>=0.3",
  "fonttools>=4.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx2>=2.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "TID", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008"]
"app/routes/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fontTools.*", "scipy.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires a live PostgreSQL database (set DATABASE_URL)"]
filterwarnings = ["error"]
