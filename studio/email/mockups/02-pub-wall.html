<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Shirtfaced — Pub Wall</title><link rel="stylesheet" href="mockup.css"><style>body{background:#51493b}.email{background:#eee5cf;background-image:repeating-linear-gradient(4deg,#0000 0 34px,#5f503d12 35px)}.wall{position:relative;min-height:740px;padding:46px}.wall:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,#7a3b241c 0 50px,transparent 52px),radial-gradient(circle at 82% 76%,#7a3b241c 0 64px,transparent 66px)}.note,.snap,.sticker{position:relative;z-index:1}.note{background:#fff3a8;padding:28px;transform:rotate(-2deg);box-shadow:4px 8px 18px #0003;margin:42px 0}.note h1{font-size:64px}.snap{background:#fff;padding:12px 12px 50px;transform:rotate(3deg);box-shadow:4px 8px 18px #0004}.snap img{height:250px}.scribble{font:700 22px "Comic Sans MS",cursive;transform:rotate(-4deg);margin:24px 8px}.sticker{display:inline-flex;align-items:center;gap:12px;background:#f03;color:#fff;border:4px solid #fff;border-radius:999px;padding:10px 18px;transform:rotate(-7deg);font-weight:900}.footer{padding:34px 46px;background:#27231d;color:#eee5cf}</style></head><body><article class="email"><main class="wall"><img class="logo note" style="width:290px;padding:18px" src="../../../public/logo-lockup.png" alt="Shirtfaced"><div class="note"><div class="kicker">Welcome, mate</div><h1 class="display">You found us.</h1><p class="copy">We make shirts for nights that start with one and end with somebody holding a traffic cone.</p><a class="button" href="#">See what’s going on</a></div><div class="snap"><img class="photo" src="../../../public/social/instagram-logo-variations.jpg" alt="Shirtfaced artwork"><div class="scribble">Evidence, apparently.</div></div><div class="sticker"><img class="smiley" style="width:42px;height:42px" src="../../../DEV/smiley.svg" alt=""> GOOD MATES ONLY</div></main><footer class="footer">Good mates, great times, shirtfaced.<br>You’re receiving this because you asked for it. Surprisingly responsible.</footer></article></body></html>
